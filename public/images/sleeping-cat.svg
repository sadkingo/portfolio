<svg className="w-40 z-10" viewBox="0 0 250 120" xmlns="http://www.w3.org/2000/svg" fillRule="evenodd"
    clipRule="evenodd" strokeLinecap="round" strokeLinejoin="round" strokeMiterlimit="1.5" version="1.1">
    <style>
        .toggle-dark-light {
            cursor: pointer;
        }

        /* include transitions for the elements modified as the input is checked */
        .toggle-dark-light .light {
            transition: opacity 0.75s cubic-bezier(0.68, 0.25, 0.265, 1);
        }

        .toggle-dark-light .translate,
        .toggle-dark-light .rotate,
        .toggle-dark-light .background,
        .toggle-dark-light .astronaut,
        .toggle-dark-light .surfer {
            transition: transform 0.75s cubic-bezier(0.68, 0.25, 0.265, 1);
        }

        /* make the .light element fully transparent to have the .dark variant see through */
        [data-theme="dark"] .light {
            opacity: 0;
        }

        /* translate the sun/moon toward the right (by default it is pushed back with a negative translation) */
        [data-theme="dark"] .translate {
            transform: translateX(0px);
        }

        /* rotate the moon (by default it is rotated counter-clockwise) */
        [data-theme="dark"] .rotate {
            transform: rotate(0deg);
        }

        [data-theme="dark"] .background {
            transform: translate(0px) scale(1);
        }
    </style>
    <g class="toggle-dark-light"  transform="translate(150,2.5)">
        <defs>
            <rect id="sleeping-cat_svg__background" x="0" y="0" width="90" height="40" rx="20"></rect>
            <clipPath id="sleeping-cat_svg__clip">
                <use href="#background"></use>
            </clipPath>

            <linearGradient id="sleeping-cat_svg__gradient-light" x1="0" x2="0" y1="0" y2="1">
                <stop stop-color="#8bc8f2" offset="0"></stop>
                <stop stop-color="#fff" offset="1"></stop>
            </linearGradient>

            <filter id="sleeping-cat_svg__blur-light">
                <feGaussianBlur stdDeviation="1"></feGaussianBlur>
            </filter>

            <pattern id="sleeping-cat_svg__pattern-light" width="0.1" height="1" viewBox="0 0 10 45">
                <path fill="#40b5f8" d="M 0 0 a 6 6 0 0 0 10 0 v 45 h -10 z"></path>
            </pattern>

            <linearGradient id="sleeping-cat_svg__gradient-dark" x1="0" x2="0" y1="0" y2="1">
                <stop stop-color="#1F2241" offset="0"></stop>
                <stop stop-color="#7D59DF" offset="1"></stop>
            </linearGradient>

            <linearGradient id="sleeping-cat_svg__gradient-mask" x1="0" x2="0" y1="0" y2="1">
                <stop stop-color="#000" offset="0"></stop>
                <stop stop-color="#fff" offset="1"></stop>
            </linearGradient>

            <mask id="sleeping-cat_svg__mask-dark">
                <use fill="url(#gradient-mask)" href="#background"></use>
            </mask>

            <radialGradient id="sleeping-cat_svg__gradient-moon">
                <stop stop-color="#fdfdfd" offset="0.7"></stop>
                <stop stop-color="#e2e2e2" offset="1"></stop>
            </radialGradient>

            <radialGradient id="sleeping-cat_svg__gradient-crater">
                <stop stop-color="#e0e0e0" offset="0"></stop>
                <stop stop-color="#d9d9d9" offset="1"></stop>
            </radialGradient>

            <pattern id="sleeping-cat_svg__pattern-dark" width="0.2" height="1" viewBox="0 0 20 45">
                <path fill="#fff" d="M 2 5 l 1 1 l -1 1 l -1 -1 l 1 -1"></path>
                <path fill="#fff" d="M 10 16 l 1 1 l -1 1 l -1 -1 l 1 -1"></path>
                <path fill="#fff" d="M 16 27 l 1 1 l -1 1 l -1 -1 l 1 -1"></path>
                <path fill="#fff" d="M 10 38 l 1 1 l -1 1 l -1 -1 l 1 -1"></path>
            </pattern>
        </defs>

        <g transform="translate(5 2.5)">
            <g clip-path="url(#clip)">
                <g class="dark">
                    <use fill="url(#gradient-dark)" href="#background"></use>

                    <g class="background" transform="translate(0 -40) scale(1 0.4)">
                        <rect transform="translate(-40 0) rotate(4)" fill="url(#pattern-dark)" x="0" y="0" width="100"
                            height="45"></rect>
                    </g>
                    <use mask="url(#mask-dark)" fill="url(#gradient-dark)" href="#background"></use>
                </g>
                <g class="light">
                    <use fill="url(#gradient-light)" href="#background"></use>

                    <g class="background" transform="translate(-30 -20)">
                        <g transform="translate(30 20)">

                        </g>
                    </g>
                </g>
            </g>
        </g>

        <g transform="translate(77.5 22.5)">

            <g class="translate" transform="translate(-55)">

                <g class="rotate" transform="rotate(-100)">
                    <g class="dark">
                        <circle fill="url(#gradient-moon)" cx="0" cy="0" r="20.5"></circle>
                        <g transform="translate(-8 -7.5)">
                            <ellipse transform="rotate(-30)" fill="url(#gradient-crater)" stroke="#d5d5d5"
                                stroke-width="0.2" cx="0" cy="0" rx="4" ry="3"></ellipse>
                        </g>
                        <g transform="translate(11 5)">
                            <ellipse fill="url(#gradient-crater)" stroke="#d5d5d5" stroke-width="0.2" cx="0" cy="0"
                                rx="3.85" ry="4"></ellipse>
                        </g>
                        <g transform="translate(-6 12)">
                            <ellipse transform="rotate(-10)" fill="url(#gradient-crater)" stroke="#d5d5d5"
                                stroke-width="0.2" cx="0" cy="0" rx="2" ry="1.75"></ellipse>
                        </g>
                    </g>
                </g>
                <g class="light">
                    <circle fill="#FFD21F" cx="0" cy="0" r="21" filter="url(#blur-light)"></circle>
                    <circle fill="#FFD21F" cx="0" cy="0" r="20.5"></circle>
                </g>
            </g>
        </g>
    </g>

    <style>
        .theCat {
            cursor: pointer;
        }

        #tail {
            position: absolute;
        }
    </style>
