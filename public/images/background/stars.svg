  <defs>
    <style>
      .cls-1 {
        fill: #efefef;
      }

      #small circle:nth-child(even) {
        animation: starsBlink 2.7s ease-in-out infinite alternate;
      }

      #small circle:nth-child(odd) {
        animation: starsBlink 1.5s ease-in-out infinite alternate;
      }

      #big circle:nth-child(even) {
        animation: starsBlink 3s ease-in-out infinite alternate;
      }

      #big circle:nth-child(odd) {
        animation: starsBlink 1.7s ease-in-out infinite alternate;
      }

      @keyframes starsBlink {
        0% {
          opacity: 0.2;
        }

        100% {
          opacity: 1;
        }
      }
    </style>
  </defs>
